# JVM-аргументы Gradle. Loom при первом запуске перемаппит Minecraft,
# поэтому памяти нужно немало: -Xmx2G — разумный минимум.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# configuration-cache отключён намеренно: с Loom он работает нестабильно.
org.gradle.configuration-cache=false

# Версии Minecraft / Fabric.
# Актуальные значения всегда можно посмотреть здесь: https://fabricmc.net/develop
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.14

# Версия плагина Fabric Loom.
# ВАЖНО: 1.8-SNAPSHOT — последняя ветка Loom, которая запускается на JDK 21.
# Loom 1.9+ требует для своей работы JDK 22+, а 1.18+ — JDK 25.
# Сам мод при этом компилируется и работает на Java 21 (см. build.gradle.kts).
loom_version=1.8-SNAPSHOT

# Fabric API для Minecraft 1.21.1.
# Мод использует fabric-message-api-v1 (ClientSendMessageEvents) и
# fabric-lifecycle-events-v1 (ServerTickEvents, ServerLifecycleEvents),
# которые входят в общий артефакт fabric-api.
fabric_api_version=0.116.17+1.21.1

# Свойства мода.
mod_version=1.0.0
maven_group=com.example
archives_base_name=ollama-builder
